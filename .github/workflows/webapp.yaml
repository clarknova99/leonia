name: Build and Release Webapp

on:
  workflow_dispatch:

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the GitHub release step
      packages: write   # to push images to ghcr.io

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Ensure a full clone to avoid shallow clone issues
          lfs: true       # CRITICAL: pull the real data/webapp serve set, not
                          # the LFS pointer stubs — otherwise the bundled image
                          # bakes tiny pointer files and the webapp serves nothing.

      # QEMU enables building the linux/arm64 variant on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every run produces a unique, sortable tag: <branch>-YYYY-MM-DD-HH-MM-SS-<shortsha> (UTC).
      # Digest is still used by Kubernetes for immutable pinning; the tag exists for traceability and rollback.
      - name: Compute image tag
        id: image_tag
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          TS=$(date -u +"%Y-%m-%d-%H-%M-%S")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${TS}-${SHA}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Computed tag: ${IMAGE_TAG}"

      # The webapp image is built data-bundled (--target bundled): the
      # published serve set (data/webapp/) is Git-LFS tracked and baked into
      # the image, so every published image is self-contained (no runtime
      # data mount). The `lfs: true` checkout above is what makes the real
      # files (not pointer stubs) available to the build.
      - name: Build and push Main
        if: github.ref_name == 'main'
        id: build_main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./webapp/Dockerfile
          target: bundled
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/clarknova99/leonia/webapp, ghcr.io/clarknova99/leonia/webapp:${{ env.IMAGE_TAG }}

      - name: Build and push Stage
        if: github.ref_name == 'stage'
        id: build_stage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./webapp/Dockerfile
          target: bundled
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/clarknova99/leonia/webapp:${{ env.IMAGE_TAG }}

      - name: Build and push dev
        if: github.ref_name == 'dev'
        id: build_dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./webapp/Dockerfile
          target: bundled
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/clarknova99/leonia/webapp:${{ env.IMAGE_TAG }}

      - name: Delete existing release and tag if they exist
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="webapp-${{ env.IMAGE_TAG }}"
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" | jq -r .id)

          if [ "$RELEASE_ID" != "null" ]; then
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG_NAME"
          fi

      - name: Create or update GitHub release
        if: github.ref_name == 'main'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webapp-${{ env.IMAGE_TAG }}
          name: Webapp Release ${{ env.IMAGE_TAG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opens AND auto-merges a PR against the pi-talos GitOps repo bumping the
      # leonia HelmRelease image tag to the freshly built one, so Flux rolls out
      # the new image without manual intervention. Requires a PAT with repo +
      # workflow scope on clarknova99/pi-talos, stored as PI_TALOS_PAT.
      - name: Create and merge PR in pi-talos repo
        if: github.ref_name == 'main'
        env:
          PI_TALOS_PAT: ${{ secrets.PI_TALOS_PAT }}
          GH_TOKEN: ${{ secrets.PI_TALOS_PAT }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          HELMRELEASE=kubernetes/apps/default/leonia/app/helmrelease.yaml
          BRANCH_NAME=update-leonia-image-${IMAGE_TAG}

          git clone https://x-access-token:${PI_TALOS_PAT}@github.com/clarknova99/pi-talos.git
          cd pi-talos

          # Recreate the branch from a clean main if it already exists remotely.
          if git ls-remote --exit-code --heads origin ${BRANCH_NAME}; then
            git push origin --delete ${BRANCH_NAME}
          fi
          git checkout -b ${BRANCH_NAME}

          yq e ".spec.values.controllers.leonia.containers.app.image.tag = \"${IMAGE_TAG}\"" -i ${HELMRELEASE}
          git add ${HELMRELEASE}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Update leonia webapp image to ${IMAGE_TAG}"
          git push origin ${BRANCH_NAME}

          PR_URL=$(gh pr create \
            --repo clarknova99/pi-talos \
            --title "Update leonia webapp image to ${IMAGE_TAG}" \
            --body "Bumps the leonia HelmRelease image tag to \`${IMAGE_TAG}\` (built from leonia@${{ github.sha }})." \
            --head ${BRANCH_NAME} \
            --base main)
          echo "PR created: ${PR_URL}"

          # Auto-merge so the new image rolls out without manual intervention.
          # --admin bypasses any required reviews/checks (the PAT user owns the
          # repo); --delete-branch cleans up the bump branch afterwards.
          gh pr merge "${PR_URL}" \
            --repo clarknova99/pi-talos \
            --merge \
            --admin \
            --delete-branch
          echo "PR merged: ${PR_URL}"
